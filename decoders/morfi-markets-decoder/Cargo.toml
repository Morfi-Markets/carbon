[package]
name = "carbon-morfi-markets-decoder"
version = "2.0.0"
rust-version = { workspace = true }
edition = { workspace = true }
description = "Morfi Markets ABI decoder for Carbon"
license = { workspace = true }
readme = "README.md"
repository = "https://github.com/Morfi-Markets/carbon"
keywords = ["solana", "decoder", "morfi"]
categories = ["encoding"]

[lib]
crate-type = ["rlib"]

[features]
default = ["decoder"]
# Carbon decoding and ABI types. Without it, the crate has only `layout`, which
# has no dependencies.
decoder = [
    "dep:borsh",
    "dep:carbon-core",
    "dep:log",
    "dep:serde",
    "dep:solana-instruction",
    "dep:solana-pubkey",
    "dep:strum_macros",
]

[dependencies]
borsh = { workspace = true, features = ["derive"], optional = true }
carbon-core = { workspace = true, features = ["macros"], optional = true }
log = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
solana-pubkey = { workspace = true, optional = true }
strum_macros = { version = "0.28", optional = true }

[dev-dependencies]
bs58 = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true }
